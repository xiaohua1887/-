<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7fc">
  <title>界面感知试测 · 6维×16题 · 三类比较</title>
<link rel="stylesheet" href="./styles.css?v=6x16-2">



</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="问卷首页"><span class="brand-mark">↔</span><span>界面感知 · 试测<small>SIX DIMENSIONS / THREE CHOICES</small></span></a>
    <div class="session-tools" id="session-tools" hidden>
      <div class="clock"><span>总用时</span><strong id="wall-clock">00:00</strong></div>
      <div class="clock secondary-clock"><span>有效作答</span><strong id="active-clock">00:00</strong></div>
      <button id="partial-download" class="button button-quiet partial-export" type="button">下载已答CSV</button><button id="pause-button" class="button button-quiet" type="button">暂停休息</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer"><span>轻量试测 · 每份6维 × 16题</span><span>请根据视觉印象判断，无标准答案</span></footer>
  <dialog id="pause-dialog" class="modal"><div class="modal-content"><span class="eyebrow">TAKE A BREAK</span><h2>休息一下，再继续。</h2><p>暂停期间不计入有效作答时间；总用时仍会继续。</p><p class="muted">进度保存在当前浏览器中。</p><button id="resume-button" class="button button-primary" type="button">继续作答</button></div></dialog>
  <dialog id="zoom-dialog" class="zoom-dialog"><button id="close-zoom" class="button zoom-close" type="button">关闭大图 ×</button><img id="zoom-image" alt="界面放大图"></dialog>
  <dialog id="confirm-dialog" class="modal"><div class="modal-content"><h2>开始另一份试测？</h2><p id="confirm-message"></p><div class="actions"><button id="confirm-ok" class="button button-primary" type="button">确认重新开始</button><button id="confirm-cancel" class="button" type="button">返回</button></div></div></dialog>
<dialog id="large-compare" class="large-compare" aria-labelledby="large-question"><div class="large-heading"><h2 id="large-question">双图大图对比</h2><button id="close-large" class="button" type="button">返回作答 ×</button></div><div class="large-images"><figure><figcaption>左图</figcaption><img id="large-left" alt="左图大图"></figure><figure><figcaption>右图</figcaption><img id="large-right" alt="右图大图"></figure></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>此问卷需要启用浏览器的 JavaScript 才能作答。</noscript>
<script defer src="./data.js?v=6x16-2"></script>
<script defer src="./core.js?v=6x16-2"></script>
<script defer src="./app.js?v=6x16-2"></script>
</body>
</html>
